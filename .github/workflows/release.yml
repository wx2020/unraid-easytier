name: Build and Release

on:
  push:
    tags: ['20*']
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: true
        default: '2026.08.06.0002'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          [[ "${VERSION}" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{4}(-(alpha|beta|rc)[0-9]*)?$ ]]
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "SOURCE_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
          printf '%s\n' "${VERSION}" > VERSION

      - name: Validate source
        shell: bash
        run: |
          python tests/validate-ca.py
          python tests/validate-translations.py
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find src -type f \( -name '*.sh' -o -name 'rc.easytier' \) -print0 |
            xargs -0 -n1 sh -n

      - name: Render WebUI pages
        shell: bash
        run: |
          sudo mkdir -p /usr/local/php /usr/local/emhttp/plugins
          sudo cp -a src/usr/local/php/easytier-utils /usr/local/php/
          sudo cp -a src/usr/local/emhttp/plugins/easytier /usr/local/emhttp/plugins/
          php tests/render-pages.php

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          bash build.sh
          echo "PKG_FILE=unraid-easytier-utils-${VERSION}-noarch-1.txz" >> "$GITHUB_ENV"

      - name: Resolve latest EasyTier release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # P1 B-02: filter prerelease/draft, verify asset size and integrity
          RELEASE_JSON="$(gh api repos/EasyTier/EasyTier/releases/latest)"
          # Ensure latest is not prerelease/draft
          if jq -e 'select(.prerelease==true or .draft==true)' <<<"${RELEASE_JSON}" >/dev/null; then
            echo "Latest release is prerelease/draft, falling back to releases list"
            RELEASE_JSON="$(gh api 'repos/EasyTier/EasyTier/releases?per_page=20' | jq '[.[] | select(.prerelease==false and .draft==false)][0]')"
          fi
          ASSET_NAME="$(jq -r '
            .assets[]
            | select(.name | test("^easytier-linux-x86_64-v[^/]+\\.zip$"))
            | .name
          ' <<<"${RELEASE_JSON}" | head -n 1)"
          ASSET_URL="$(jq -r --arg name "${ASSET_NAME}" '
            .assets[] | select(.name == $name) | .browser_download_url
          ' <<<"${RELEASE_JSON}")"
          API_DIGEST="$(jq -r --arg name "${ASSET_NAME}" '
            .assets[] | select(.name == $name) | .digest
          ' <<<"${RELEASE_JSON}")"
          ASSET_SIZE="$(jq -r --arg name "${ASSET_NAME}" '
            .assets[] | select(.name == $name) | .size
          ' <<<"${RELEASE_JSON}")"
          test -n "${ASSET_NAME}"
          test "${ASSET_URL}" != "null"
          [[ "${API_DIGEST}" == sha256:* ]]
          test "${ASSET_SIZE}" != "null" && test "${ASSET_SIZE}" -gt 0
          curl --fail --location --retry 3 --output "${ASSET_NAME}" "${ASSET_URL}"
          # Verify download size matches API
          DOWNLOADED_SIZE="$(stat -c%s "${ASSET_NAME}")"
          test "${DOWNLOADED_SIZE}" -eq "${ASSET_SIZE}"
          ASSET_SHA256="$(sha256sum "${ASSET_NAME}" | awk '{print $1}')"
          test "${ASSET_SHA256}" = "${API_DIGEST#sha256:}"
          # Verify zip integrity (P1 B-02/B-03)
          unzip -t "${ASSET_NAME}" >/dev/null
          echo "EASYTIER_ASSET=${ASSET_NAME}" >> "$GITHUB_ENV"
          echo "EASYTIER_ASSET_URL=${ASSET_URL}" >> "$GITHUB_ENV"
          echo "EASYTIER_ASSET_SHA256=${ASSET_SHA256}" >> "$GITHUB_ENV"

      - name: Generate plugin manifests
        shell: bash
        run: |
          set -euo pipefail
          SHA256="$(sha256sum "${PKG_FILE}" | awk '{print $1}')"
          export SHA256
          # P0 B-01: anchored replacements only (avoid global SOURCE_VERSION substitution that pollutes CHANGES history)
          sed -E \
            -e "s/version=\"[^\"]+\"/version=\"${VERSION}\"/" \
            -e "s/unraid-easytier-utils-[^\"]*-noarch-1\\.txz/unraid-easytier-utils-${VERSION}-noarch-1.txz/g" \
            -e "s|releases/download/[^/]+/unraid-easytier-utils|releases/download/${VERSION}/unraid-easytier-utils|g" \
            -e "s/PLACEHOLDER_SHA256/${SHA256}/" \
            -e "s|EASYTIER_ASSET_URL|${EASYTIER_ASSET_URL}|g" \
            -e "s/EASYTIER_ASSET_SHA256/${EASYTIER_ASSET_SHA256}/g" \
            -e "s/EASYTIER_ASSET/${EASYTIER_ASSET}/g" \
            plugin/easytier.plg > "easytier-${VERSION}.plg"
          cp "easytier-${VERSION}.plg" easytier.plg
          # P2 B-05: negative check - ensure no placeholder remains
          if grep -q "PLACEHOLDER" easytier.plg; then
            echo "ERROR: placeholder still present in easytier.plg"
            grep -n "PLACEHOLDER" easytier.plg
            exit 1
          fi
          ! grep -q PLACEHOLDER_SHA256 easytier.plg
          ! grep -q EASYTIER_ASSET easytier.plg
          printf '%s  %s\n' "${SHA256}" "${PKG_FILE}" > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.value }}
          tag_name: ${{ steps.version.outputs.value }}
          prerelease: ${{ contains(steps.version.outputs.value, '-') }}
          generate_release_notes: true
          files: |
            ${{ env.PKG_FILE }}
            ${{ env.PKG_FILE }}.sha256
            easytier-${{ env.VERSION }}.plg
            easytier.plg
            checksums.txt
