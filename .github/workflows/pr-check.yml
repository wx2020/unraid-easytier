name: PR Check

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          grep -q "\"version\": \"${VERSION}\"" plugin/plugin.json
          grep -q "version=\"${VERSION}\"" plugin/easytier.plg
          ! grep -R "include/easytier-utils" src
          grep -q '<SHA256>PLACEHOLDER_SHA256</SHA256>' plugin/easytier.plg
          test -s translations/zh_CN/EasyTier/easytier.txt
          grep -q 'rm -f /usr/local/emhttp/languages/zh_CN/easytier.dot' src/install/doinst.sh
          grep -q '/usr/local/emhttp/languages/zh_CN/easytier.dot' plugin/easytier.plg
          grep -q 'rm -f /usr/local/emhttp/plugins/easytier/event/array_started' src/install/doinst.sh
          ! grep -q 'ln -sfn ../restart.sh /usr/local/emhttp/plugins/easytier/event' src/install/doinst.sh
          grep -q 'wait_for_network' src/usr/local/etc/rc.d/rc.easytier
          grep -q 'nohup /bin/sh' src/usr/local/emhttp/plugins/easytier/restart.sh
          grep -q 'EASYTIER_ASSET_URL' plugin/easytier.plg
          python tests/validate-ca.py
          python tests/validate-translations.py

      - name: Validate PHP syntax
        shell: bash
        run: find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate shell syntax
        shell: bash
        run: |
          find src -type f \( -name '*.sh' -o -name 'rc.easytier' \) -print0 |
            xargs -0 -n1 sh -n
          bash -n build.sh

      - name: Render WebUI pages
        shell: bash
        run: |
          sudo mkdir -p /usr/local/php /usr/local/emhttp/plugins
          sudo cp -a src/usr/local/php/easytier-utils /usr/local/php/
          sudo cp -a src/usr/local/emhttp/plugins/easytier /usr/local/emhttp/plugins/
          php tests/render-pages.php

      - name: Build and inspect package
        shell: bash
        run: |
          set -euo pipefail
          bash build.sh
          VERSION="$(cat VERSION)"
          PKG="unraid-easytier-utils-${VERSION}-noarch-1.txz"
          test -s "${PKG}"
          sha256sum -c "${PKG}.sha256"
          mkdir package
          tar -xf "${PKG}" -C package
          test -f "package/unraid-easytier-utils-${VERSION}-noarch-1/usr/local/etc/rc.d/rc.easytier"
          ROOT="package/unraid-easytier-utils-${VERSION}-noarch-1"
          test -f "${ROOT}/usr/local/emhttp/plugins/easytier/EasyTier.page"
          test -f "${ROOT}/usr/local/php/easytier-utils/bootstrap.php"
          test -s "${ROOT}/usr/local/emhttp/languages/zh_CN/easytier.txt"
          cmp translations/zh_CN/EasyTier/easytier.txt \
            "${ROOT}/usr/local/emhttp/languages/zh_CN/easytier.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: easytier-pr-package
          path: |
            *.txz
            *.txz.sha256
          retention-days: 7
